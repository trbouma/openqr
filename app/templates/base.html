<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>{% block title %}OpenQR{% endblock %}</title>
  <meta name="description" content="Resolve OpenETR QR references into independently verifiable anchor evidence.">
  <link rel="icon" href="{{ url_for('static', path='openetr-logo.png').path }}">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css').path }}">
  <script src="{{ url_for('static', path='progress.js').path }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="OpenQR home">
      <img src="{{ url_for('static', path='openetr-logo.png').path }}" alt="">
      <span><strong>OpenQR</strong><small>OpenETR resolver</small></span>
    </a>
    <nav class="header-nav" aria-label="Primary navigation">
      <a class="header-link" href="/register">Register</a>
      <a class="header-link" href="https://github.com/trbouma/openetr/blob/main/docs/specs/OPENETR_QR_RESOLVER_PROFILE_1_0.md">Specification</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>OpenETR QR Resolver Profile 1.0</span>
    {% if git_commit != "unknown" %}<span>Build {{ git_commit[:8] }}</span>{% endif %}
  </footer>
</body>
</html>

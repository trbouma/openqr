[tool.poetry]
name = "openqr"
version = "0.1.0"
description = "Minimal OpenETR QR resolver"
authors = ["trbouma <trbouma@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.115,<0.116"
gunicorn = ">=23,<24"
jinja2 = ">=3.1,<4"
stroma-nostr = { git = "https://github.com/trbouma/stroma.git", branch = "main" }
python-multipart = ">=0.0.20,<1"
qrcode = { version = ">=8.2,<9", extras = ["pil"] }
uvicorn = { version = ">=0.35,<1", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1"
pytest = ">=8.4,<10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
